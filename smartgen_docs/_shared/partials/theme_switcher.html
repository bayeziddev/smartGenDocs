{#
    Theme switcher trigger button + popover markup. Drop this wherever the
    theme control should live in your header/toolbar. It renders empty --
    theme_switcher_script.html (include once, near the end of <body>) fills
    the menu in and wires up all the behavior. No context required.
#}
<div class="theme-switcher" id="theme-switcher">
    <button class="icon-btn" id="theme-toggle" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="theme-menu" aria-label="Choose theme">
        <svg class="icon icon-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
        <svg class="icon icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8 6 18M18 6l1.8-1.8"/></svg>
    </button>
    <div class="theme-menu" id="theme-menu" role="menu" aria-label="Theme" hidden></div>
</div>
