name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  validate-and-publish:
    name: Validate smartgen.yml and Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine .

      - name: Validate smartgen.yml and build site preview
        run: |
          if [ -f "smartgen.yml" ]; then
            echo "Found smartgen.yml - running validation build..."
            smartgen-docs build
          else
            echo "No smartgen.yml in root; initializing sample project and validating..."
            smartgen-docs init
            smartgen-docs build
          fi

      - name: Build package distribution (sdist and wheel)
        run: python -m build

      - name: Check package distribution with twine
        run: twine check dist/*

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
